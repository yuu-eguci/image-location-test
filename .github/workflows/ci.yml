name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # Dockerfile の uv と同じ
          version: "0.13.1"
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker compose build
      - name: Start the app, stop it, and start it again
        run: |
          docker compose up --detach --wait --wait-timeout 60
          docker compose stop
          docker compose up --detach --wait --wait-timeout 60
          docker compose down
      - run: docker build --target dev --tag image-location-test-dev .
      - run: docker run --rm image-location-test-dev
