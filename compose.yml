services:
  app:
    build:
      context: .
      target: app
    init: true
    environment:
      IMAGETEST_SIZE: ${IMAGETEST_SIZE:-640x480}
    ports:
      # 自分の PC からだけ見られるようにする (noVNC にパスワードは無い)
      - "127.0.0.1:6080:6080"
    volumes:
      - ./image:/app/image:ro
      - ./output:/app/output
    healthcheck:
      # 仮想ディスプレイと VNC が動いていれば "RFB" で始まる挨拶が返ってくる
      test: ["CMD", "python", "-c", "import socket; assert socket.create_connection(('localhost', 5900), 2).recv(3) == b'RFB'"]
      interval: 2s
      retries: 15

  dev:
    build:
      context: .
      target: dev
    profiles: [dev]
    volumes:
      - .:/app
