[project]
name = "image-location-test"
version = "2.0.0"
description = "pygame の画面上で画像を配置して座標を調べるツール"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pygame-ce>=2.5.8",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
# 元の名前を残しているファイル名。
"ImageTest.py" = ["N999"]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
